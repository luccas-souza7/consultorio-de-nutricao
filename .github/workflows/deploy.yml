name: Publicar site

# Gera o site com Eleventy e publica no GitHub Pages.
# Roda a cada alteração na main, manualmente, quando chamado por outro workflow
# e uma vez por dia (para liberar artigos com data de publicação agendada).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código (sempre a versão mais nova da main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Gerar o site
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Enviar o site gerado
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
